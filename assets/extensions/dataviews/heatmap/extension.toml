schema = 1
kind = "dataview"
id = "heatmap"
title = "Heatmap"
description = "A grid of numbers coloured by size: results by group, a timetable, correlations. Negative and positive values get two colours."
steps = ["rows", "series"]

[needs]
numbers = 1
rows = 30

[options.values]
type = "boolean"
default = true
description = "The numbers in the cells"

[options.scale]
type = "string"
enum = ["auto", "sequential", "diverging"]
default = "auto"
description = "One colour from light to strong, or two colours either side of 0; auto takes two when there are values below and above 0"

[options.min]
type = "number"
description = "The value of the lightest colour"

[options.max]
type = "number"
description = "The value of the strongest colour"
