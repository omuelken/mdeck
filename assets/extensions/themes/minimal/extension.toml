schema = 1
kind = "theme"
id = "minimal"
title = "Minimal"
description = "Nothing but the content: system fonts, calm type, plenty of space, no decoration. Works offline."
version = "1.0.0"
author = "Tilman Schieber"
license = "MIT"
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "paper"
# System fonts only: nothing to download, the same on every computer that has them.
fonts = []

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "132px"
"--fs-title" = "104px"
"--fs-focus" = "84px"
"--fs-h" = "68px"
"--fs-sub" = "40px"
"--fs-body" = "34px"
"--fs-small" = "26px"
"--fs-eyebrow" = "24px"

# Spacing
"--pad-x" = "150px"
"--pad-y" = "84px"
"--gap-title" = "56px"
"--gap-item" = "26px"

# Type families: the system's own
"--font-display" = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"
"--font-body" = "system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"
