schema = 1
kind = "theme"
id = "neue"
title = "Neue"
description = "Swiss typography: large flush-left type, rules instead of boxes, and the accent as a surface on chapter slides."
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "lagoon"
fonts = [
  "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500;600;700&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "196px"
"--fs-title" = "132px"
"--fs-focus" = "104px"
"--fs-h" = "80px"
"--fs-sub" = "44px"
"--fs-body" = "34px"
"--fs-small" = "28px"
"--fs-eyebrow" = "24px"

# Spacing
"--pad-x" = "140px"
"--pad-y" = "72px"
"--gap-title" = "56px"
"--gap-item" = "28px"

# Type families
"--font-display" = "\"Inter Tight\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"
"--font-body" = "\"Inter\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"
