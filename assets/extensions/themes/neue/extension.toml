schema = 1
kind = "theme"
id = "neue"
title = "Neue"
description = "Swiss typography: large flush-left type, rules instead of boxes, signal red on white."
version = "1.0.0"
author = "Tilman Schieber"
license = "MIT"
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "swiss"
fonts = [
  "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500;600;700&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "196px"
"--fs-title" = "132px"
"--fs-focus" = "104px"
"--fs-h" = "80px"
"--fs-sub" = "44px"
"--fs-body" = "34px"
"--fs-small" = "28px"
"--fs-eyebrow" = "24px"

# Spacing
"--pad-x" = "140px"
"--pad-y" = "72px"
"--gap-title" = "56px"
"--gap-item" = "28px"

# Type families
"--font-display" = "\"Inter Tight\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"
"--font-body" = "\"Inter\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["keynotes and strong arguments", "design and architecture talks", "talks with few words per slide"]
avoid = ["dense tables", "long code listings"]
writing = """
Headings are set large and flush left: make them short statements, one idea
per slide. Chapter slides set their title in the accent and statement slides
(layout: focus) invert, so the talk gets a rhythm; use them for turns and
conclusions. Emphasis (*word*) shows in the accent: one key word, not phrases.
"""
