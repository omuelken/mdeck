schema = 1
kind = "theme"
id = "terminal"
title = "Terminal"
description = "Dark by default, monospace throughout, terminal green accent."
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "forest"
appearance = "dark"
fonts = [
  "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type families — monospace throughout
"--font-display" = "'JetBrains Mono', ui-monospace, monospace"
"--font-body" = "'JetBrains Mono', ui-monospace, monospace"

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "100px"
"--fs-h" = "52px"
"--fs-sub" = "36px"
"--fs-body" = "30px"
"--fs-eyebrow" = "22px"
"--fs-small" = "20px"
"--fs-focus" = "68px"
"--fs-title" = "60px"

# Spacing
"--pad-x" = "120px"
"--pad-y" = "80px"
"--gap-title" = "32px"
"--gap-item" = "20px"
