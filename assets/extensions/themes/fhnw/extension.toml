schema = 1
kind = "theme"
id = "fhnw"
title = "FHNW"
description = "The FHNW corporate design: Inter, black on white, yellow accent areas."
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "brand"
palettes = ["brand"]  # the corporate design: no other palettes
fonts = [
  "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Spectral:ital,wght@0,400;1,400&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Theme-specific structural tokens
"--grey-100" = "#F1F1EE"
"--grey-200" = "#DEDED9"
"--grey-300" = "#BEBDB9"
"--grey-800" = "#4C4C4C"

# Type scale (px) — projection-appropriate at 1920×1080.
"--fs-display" = "152px"
"--fs-title" = "96px"
"--fs-focus" = "80px"
"--fs-h" = "64px"
"--fs-sub" = "40px"
"--fs-body" = "32px"
"--fs-small" = "24px"
"--fs-eyebrow" = "24px"

# Spacing
"--pad-x" = "112px"
"--pad-y" = "72px"
"--gap-title" = "48px"
"--gap-item" = "20px"

# Akzentfläche interior padding
"--akzent-pad-x" = "56px"
"--akzent-pad-y" = "40px"

# Akzentlinie band height — CD-Manual §2.4 (≈ ½ logo height).
"--akzentlinie-h" = "12px"

# Type families — Inter only, per CD-Manual §2.2
"--font-display" = "\"Inter\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif"
"--font-body" = "\"Inter\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif"
"--font-serif" = "\"Spectral\", Georgia, \"Times New Roman\", serif"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"
