"--muted" = "#666666"
"--rule" = "#dadada"
"--accent" = "#e30613"
"--accent-2" = "#0047bb"
"--on-accent" = "#ffffff"

[dark]
"--bg" = "#0d0d0d"
"--surface" = "#1b1b1b"
"--ink" = "#f5f5f5"
"--ink-soft" = "#d0d0d0"
"--muted" = "#8f8f8f"
"--rule" = "#2e2e2e"
"--accent" = "#ff3b30"
"--accent-2" = "#6f9bff"
"--on-accent" = "#0d0d0d"
