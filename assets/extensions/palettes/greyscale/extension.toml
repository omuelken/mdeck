schema = 1
kind = "palette"
id = "greyscale"
title = "Greyscale"
description = "Black, white and greys only, code and callouts too: for printing and for a quiet look."
version = "1.0.0"
author = "Tilman Schieber"
license = "MIT"

# No colour anywhere: emphasis is black against the softer body text, the
# second accent a mid grey, the third (warnings) a lighter grey; code uses
# greys instead of its usual colours.
[light]
"--bg" = "#ffffff"
"--surface" = "#f0f0f0"
"--ink" = "#141414"
"--ink-soft" = "#363636"
"--muted" = "#606060"
"--rule" = "#d4d4d4"
"--accent" = "#000000"
"--accent-2" = "#6e6e6e"
"--accent-3" = "#9a9a9a"
"--on-accent" = "#ffffff"
"--token-default" = "#141414"
"--token-comment" = "#6b6b6b"
"--token-string" = "#454545"
"--token-number" = "#000000"
"--token-keyword" = "#000000"
"--token-function" = "#2a2a2a"
"--token-operator" = "#555555"

[dark]
"--bg" = "#121212"
"--surface" = "#1f1f1f"
"--ink" = "#f2f2f2"
"--ink-soft" = "#d0d0d0"
"--muted" = "#9c9c9c"
"--rule" = "#303030"
"--accent" = "#ffffff"
"--accent-2" = "#a6a6a6"
"--accent-3" = "#6e6e6e"
"--on-accent" = "#121212"
"--token-default" = "#f2f2f2"
"--token-comment" = "#9a9a9a"
"--token-string" = "#c4c4c4"
"--token-number" = "#ffffff"
"--token-keyword" = "#ffffff"
"--token-function" = "#e0e0e0"
"--token-operator" = "#b0b0b0"
