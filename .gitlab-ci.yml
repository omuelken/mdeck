image: node:22

stages: [test, deploy, publish]

cache:
  key:
    files: [package-lock.json]
  paths: [node_modules/]

test:
  stage: test
  script:
    - npm ci
    - npm test

pages:
  stage: deploy
  script:
    - npm ci
    - node bin/mdeck.js docs --build
    - rm -rf public && mv docs/site/dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - npm ci
    - echo "@tilman.schieber:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
