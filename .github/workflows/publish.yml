# Publishes a tagged release to npmjs.com through trusted publishing: npm
# trusts this workflow, so no token is stored, and the package carries
# provenance. Then creates the GitHub release from the CHANGELOG.md entry,
# unless one was already written by hand.
name: publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends gh
      - uses: actions/checkout@v5
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node tools/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "mdeck ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
