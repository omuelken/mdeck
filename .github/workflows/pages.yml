# The documentation site, at https://gh.tschieber.de/mdeck/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second push waits for the deployment under way: one cancelled halfway
# stays "in progress" for Pages, which then refuses the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: node bin/mdeck.js docs --build
      - uses: actions/upload-pages-artifact@v4
        with: { path: docs/site/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
